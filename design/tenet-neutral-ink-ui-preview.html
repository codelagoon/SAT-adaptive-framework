<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tenet — UI design QA reference</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#131415}body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit}*{box-sizing:border-box}button,input,textarea{font-family:inherit}/* Mastery Engine study interface v2 — original visual system, OnePrep-inspired IA.
   Measurable data is rendered only from API responses; no fabricated performance. */
.shell {
  --ink:#14181f; --muted:#69717f; --subtle:#929aaa; --line:#e5e8ee;
  --background:#f8f9fb; --panel:#fff; --accent:#3457d5; --accent-soft:#eef2ff;
  --green:#197354; --red:#ad4e43;
  display:flex;min-height:100vh;background:var(--background);color:var(--ink);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;letter-spacing:-.012em;
}
.shell *{box-sizing:border-box}
.shell button,.shell input,.shell select,.shell textarea{font:inherit}
.shell button,.shell select{cursor:pointer}
.shell button:disabled{cursor:not-allowed}
.shell a:focus-visible,.shell button:focus-visible,.shell input:focus-visible,.shell select:focus-visible,.shell textarea:focus-visible{outline:3px solid #8ca3ff;outline-offset:3px}
.side{position:sticky;top:0;flex:0 0 236px;height:100vh;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:30px 16px 20px;z-index:20}
.brand{color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px;font-size:16px;font-weight:760;letter-spacing:-.55px;padding:0 11px;margin:2px 0 43px}
.mark{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#171e2d;color:#fff;font-size:16px;font-weight:800;letter-spacing:-.8px}
.nav{display:grid;gap:5px;position:relative}
.nav::before{content:"WORKSPACE";color:#9ba2ae;font-size:10px;font-weight:760;letter-spacing:1.55px;padding:0 15px 13px}
.navItem{min-height:43px;padding:11px 14px;display:flex;align-items:center;gap:13px;border-radius:9px;text-decoration:none;color:#68717f;font-size:13px;font-weight:580;transition:background .15s,color .15s}
.navItem:hover{background:#f4f6fa;color:#222932}
.navItem.active{background:#eef2ff;color:#294ab8;font-weight:730}
.navIcon{display:grid;place-items:center;width:20px;height:20px;color:inherit;font-family:ui-monospace,Menlo,monospace;font-size:18px}
.sideBottom{margin-top:auto;padding:20px 13px 1px;border-top:1px solid #eef0f4;display:grid;gap:9px;font-size:12px;color:var(--muted)}
.sideBottom a{text-decoration:none;color:#424b5b;font-weight:650}
.sideBottom span{font-size:11px;line-height:1.5;color:#929aa8}
.main{flex:1;min-width:0}
.header{height:68px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:0 clamp(24px,3.5vw,58px);display:flex;align-items:center;justify-content:space-between;gap:20px}
.crumb{color:#7b8492;font-size:12px;display:flex;gap:10px;align-items:center;white-space:nowrap}
.crumb span{color:#c9cfd8}.crumb strong{color:#2a303b;font-weight:690}
.courseSelect{display:flex;gap:10px;align-items:center;font-size:12px;color:#8a92a0}
.courseSelect select{height:37px;min-width:185px;max-width:280px;padding:6px 34px 6px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#2f3948;font-weight:660;outline-offset:2px}
.mobileMenu{display:none;background:transparent;border:0;color:var(--ink)}
.content{width:min(100%,1280px);margin:0 auto;padding:46px clamp(24px,3.8vw,60px) 100px}
.content h1{font-size:clamp(29px,2.7vw,37px);font-weight:760;letter-spacing:-1.55px;line-height:1.16;margin:10px 0 10px}
.content h2{font-size:19px;font-weight:720;letter-spacing:-.55px;line-height:1.3;margin:10px 0 13px}
.content h3{font-size:13px;font-weight:750;letter-spacing:-.1px;margin:26px 0 9px}
.content p{line-height:1.65;color:var(--muted);margin:9px 0}
.sub{font-size:14px;max-width:730px;margin:0 0 31px!important;color:#687381!important}
.eyebrow{font-size:10px;font-weight:790;letter-spacing:1.35px;text-transform:uppercase;color:#5371c7}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;min-width:0}
.twoCols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,.9fr);gap:17px;margin:31px 0 22px;align-items:stretch}
.homeFeature{background:#171f2d;border-color:#171f2d;color:#fff;padding:34px 36px;min-height:306px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.homeFeature::after{content:"";position:absolute;width:300px;height:300px;right:-130px;top:-190px;border:1px solid #ffffff18;border-radius:100%;box-shadow:0 0 0 45px #ffffff06,0 0 0 90px #ffffff05;pointer-events:none}
.homeFeature .eyebrow{color:#a6b7f5}
.homeFeature h2{font-size:clamp(27px,2.8vw,36px);letter-spacing:-1.2px;max-width:490px;line-height:1.17;margin:17px 0 13px;color:#fff}
.homeFeature p{color:#bbc5d5;max-width:480px;font-size:14px;line-height:1.7}
.homeFeature .buttons{margin-top:28px}
.homeFeature .primary{background:#fff;color:#131c2a;border-color:#fff}
.homeFeature .primary:hover{background:#edf1ff}
.homeFeature .secondary{background:transparent;border-color:#556072;color:#fff}
.homeFeature .secondary:hover{background:#29344a}
.cardHeading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.cardHeading h2{margin:0}
.miniLabel{color:var(--subtle);font-weight:650;font-size:11px}
.planRows{display:grid;gap:0;margin-top:18px}
.planRow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #edf0f4}
.planRow:last-child{border-bottom:0}
.planNumber{width:27px;height:27px;display:grid;place-items:center;flex:none;background:#f1f3f7;color:#657084;border-radius:8px;font-size:11px;font-weight:750}
.planRowTitle{flex:1;text-transform:capitalize;font-size:13px;font-weight:630;color:#333e4c}
.planRowTime{color:#657084;font-weight:650;font-size:12px}
.buttons{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.primary,.secondary{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:41px;border-radius:8px;padding:10px 16px;text-decoration:none;font-size:12px;font-weight:740;transition:background .15s,color .15s,border-color .15s}
.primary{background:var(--accent);border:1px solid var(--accent);color:#fff}
.primary:hover{background:#2746b6;border-color:#2746b6}
.secondary{background:#fff;border:1px solid #d9dee7;color:#2f3845}
.secondary:hover{background:#f5f7fb}
.primary:disabled,.secondary:disabled{opacity:.45;cursor:not-allowed}
.quickLinks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:21px}
.quickLinks a{display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:86px;padding:21px 20px;border:1px solid var(--line);background:#fff;border-radius:12px;text-decoration:none;font-size:13px;font-weight:720;color:#2a3544;transition:border-color .14s,transform .14s}
.quickLinks a:hover{border-color:#aabbe9;transform:translateY(-1px)}
.quickLinks a span{font-size:19px;color:#8c98aa;font-weight:400}
.caption,.footerNote{font-size:11px!important;color:#858f9f!important;line-height:1.55!important}
.footerNote{margin-top:18px!important}
.trackGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:28px}
.trackGrid button{border:1px solid var(--line);background:#fff;border-radius:11px;text-align:left;color:var(--ink);padding:24px;display:flex;justify-content:space-between;font-weight:700}
.trackGrid button:hover{border-color:#9daee1;background:#fdfdff}
.welcome{max-width:820px}
/* Distinct curriculum and lesson environment. */
.lessonLayout{display:grid;grid-template-columns:245px minmax(0,1fr);border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;min-height:660px}
.lessonList{padding:25px 12px;background:#fbfcfe;border-right:1px solid var(--line);overflow:auto;max-height:760px}
.lessonList h3{margin:21px 0 11px;padding:0 12px;text-transform:uppercase;font-size:10px;letter-spacing:1.15px;color:#9aa3b0;line-height:1.3}
.lessonList h3:first-child{margin-top:4px}
.lessonItem{width:100%;text-align:left;border:0;background:transparent;color:#627082;border-radius:7px;padding:12px 13px;display:block;font-size:12px;line-height:1.5;letter-spacing:0}
.lessonItem:hover{background:#eff2fa;color:#374152}
.lessonActive{background:#edf1ff!important;color:#304cb0!important;font-weight:750!important}
.lessonMain{padding:38px min(5vw,62px) 55px;min-width:0}
.lessonMain h2{font-size:clamp(26px,2.5vw,34px);letter-spacing:-1.2px;margin:12px 0 20px}
.lessonMain h3{font-size:12px;letter-spacing:.05px;color:#394454;margin:31px 0 10px}
.lessonMain p{max-width:730px;line-height:1.82}
.lessonMain .caption{margin:8px 0 28px}
.worked{background:#f7f8fb;border-left:3px solid #5975d3;border-radius:0 10px 10px 0;padding:25px 27px;line-height:1.9;color:#303b49;font-size:14px;white-space:pre-wrap;max-width:760px}
.lessonMain .buttons{margin-top:32px;padding-top:22px;border-top:1px solid var(--line)}
/* Question bank: filters stay in the selection space. */
.filters{display:grid;grid-template-columns:minmax(180px,1.7fr) minmax(150px,1fr) minmax(145px,.75fr) minmax(120px,.65fr);gap:10px;padding:15px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:25px 0 21px}
.filters input,.filters select{min-width:0;width:100%;height:43px;border:1px solid #dfe3e9;background:#fff;color:#303b4b;border-radius:7px;padding:0 12px;font-size:12px}
.filters input::placeholder{color:#919baa}
.bankTop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 13px}
.bankTop strong{font-size:13px;font-weight:760}
.bankList{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bankRow{display:grid;grid-template-columns:35px minmax(0,1fr) auto;gap:20px;align-items:start;padding:21px 22px;text-decoration:none;color:var(--ink);border-bottom:1px solid #eceef3;transition:background .14s}
.bankRow:last-child{border-bottom:0}.bankRow:hover{background:#fafbff}
.bankOrdinal{display:grid;place-items:center;border:1px solid #e4e7ef;color:#8993a2;font-size:11px;font-weight:750;width:32px;height:32px;border-radius:8px}
.bankRow>strong{font-weight:730;color:#4463c2;white-space:nowrap;font-size:12px;margin-top:8px}
.bankStem{font-size:13px;line-height:1.6;font-weight:600;max-width:820px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tags{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px}
.tags span{font-size:10px;font-weight:630;color:#647087;background:#f4f6f9;border:1px solid #edf0f4;border-radius:5px;padding:3px 7px}
.empty{padding:44px 24px;text-align:center;color:var(--muted);line-height:1.7}
.empty .buttons{justify-content:center}
.pagination{display:flex;align-items:center;justify-content:center;gap:18px;margin:22px 0;font-size:11px;color:var(--muted)}
.pagination button,.solveTools button{background:white;border:1px solid #dde2ea;border-radius:8px;color:#354254;padding:9px 13px;font-size:12px;font-weight:620}
.pagination button:hover:not(:disabled),.solveTools button:hover:not(:disabled){background:#f5f7fc}
.pagination button:disabled{opacity:.35}
/* Focused Solve is visually unlike selection and lesson screens. */
.solveHeader{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin:0 0 27px}
.back{font-size:12px;text-decoration:none;color:#4e5a6e;font-weight:710}
.solveTools{display:flex;align-items:center;gap:8px}
.solveTools button[aria-pressed="true"]{color:#3457d5;border-color:#a9b8ec;background:#f3f5ff}
.solveLayout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start;margin:0 auto;max-width:1000px}
.withCalculator{max-width:1480px;grid-template-columns:minmax(0,1fr) minmax(360px,.82fr)}
.solveCard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:clamp(24px,3.3vw,48px);min-width:0;box-shadow:0 4px 25px #10203506}
.questionMeta{display:flex;align-items:center;justify-content:space-between;gap:13px;font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:790;color:#4c66b8}
.questionMeta span{color:#8e98a7;font-weight:650}
.content .questionStem{font-size:clamp(20px,2.2vw,27px);font-weight:590;line-height:1.65;letter-spacing:-.45px;margin:30px 0 34px;white-space:pre-wrap}
.graph{margin:20px 0 28px;max-width:730px}
.choices{border:0;padding:0;margin:0;display:grid;gap:12px}
.choice{display:flex;align-items:center;gap:16px;min-height:62px;width:100%;border:1px solid #e0e4ea;border-radius:10px;padding:14px 18px;color:#27313f;background:#fff;cursor:pointer;transition:border-color .13s,background .13s,box-shadow .13s}
.choice:hover{border-color:#9caee3;background:#fbfcff}
.choiceActive{background:#f3f5ff;border-color:#6683e1;box-shadow:0 0 0 1px #6683e1}
.choice input{position:absolute;width:1px;height:1px;opacity:0}
.choice:focus-within{outline:3px solid #93aaf7;outline-offset:2px}
.letter{display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:50%;border:1px solid #d8dee6;color:#4f5968;font-size:12px;font-weight:760}
.choiceActive .letter{background:#3457d5;color:#fff;border-color:#3457d5}
.response,.reasonLabel textarea{width:100%;border:1px solid #dfe4eb;border-radius:9px;padding:12px;line-height:1.6;resize:vertical;background:#fff;color:#1e2835}
.reasonLabel{font-size:12px;color:#798393;display:grid;gap:8px;margin-top:25px}
.solveCard .buttons{justify-content:space-between;border-top:1px solid #eef0f3;padding-top:21px;margin-top:26px}
.hint,.feedback{padding:22px;border:1px solid #dbe3f7;border-radius:10px;margin-top:20px;background:#f7f9ff}
.hint strong,.feedback h3{font-weight:750;font-size:13px;color:#3457a0;margin:0 0 8px}
.hint span{font-size:11px;color:#7f8aa1}
.correct{background:#f2faf6;border-color:#d0ebde}.correct h3{color:#146846}
.incorrect{background:#fff9f3;border-color:#f3dec9}.incorrect h3{color:#965524}
.diagnostic{margin-top:18px;border-top:1px solid #e7dfd4;padding-top:16px}.diagnostic p{margin:10px 0}
.probeChoices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.probeChoices button{background:#fff;border:1px solid #dce2e9;border-radius:8px;padding:11px;text-align:left;font-size:12px}
.probeChoices button[aria-pressed="true"]{border-color:#4d6acc;background:#edf2ff}
.calc{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.calc header{padding:15px 17px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.calc header button{border:0;background:transparent;color:var(--ink);font-size:24px}
.calc iframe{width:100%;height:600px;border:0}
.calc p{padding:0 15px 13px;font-size:11px}
/* Analytics is its own dense but legible destination. */
.statGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:27px 0 20px}
.statGrid .card{min-height:177px;padding:23px 24px}
.stat{font-size:clamp(30px,3.8vw,45px);font-weight:780;letter-spacing:-1.9px;line-height:1.2;margin:17px 0 6px;color:#1f2735;font-variant-numeric:tabular-nums}
.statGrid p{font-size:11px;line-height:1.5;margin:7px 0 0}
.analyticsBody{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.85fr);gap:16px;align-items:start}
.analyticsBody .card{padding:25px}
.analyticsBody .card h2{margin:0 0 19px}
.skillRow{display:grid;grid-template-columns:minmax(140px,1.3fr) minmax(90px,1fr) 48px;gap:13px;align-items:center;border-bottom:1px solid #edf0f3;padding:14px 0}
.skillRow:last-child{border-bottom:0}
.skillText{display:grid;gap:4px}.skillText strong{font-size:12px;font-weight:690}.skillText span{font-size:10px;color:#919aa8}
.barTrack{height:7px;border-radius:99px;background:#edf0f5;overflow:hidden}.barFill{height:100%;background:#4966cc;border-radius:99px}
.skillRow>strong{font-variant-numeric:tabular-nums;font-size:12px;text-align:right}
.trendPanel{margin-top:17px;padding:23px 24px;background:#fff;border:1px solid var(--line);border-radius:13px}
.trendPanel h2{font-size:17px;margin:0 0 3px}.trendPanel p{font-size:11px;margin:0 0 18px}.trendSvg{width:100%;height:auto;max-height:170px;display:block}
.limitations{font-size:11px;color:#8993a3;margin-top:18px}.limitations summary{cursor:pointer;font-weight:670}.limitations li{margin:8px 0}
.error,.note{border-radius:9px;margin-bottom:19px;padding:13px 17px;display:flex;justify-content:space-between;gap:12px;border:1px solid #ebcabc;background:#fff7f3;color:#753d2c}
.note{border-color:#d7e1f8;background:#f3f6fd;color:#365184}.note button,.error button{background:transparent;border:0;color:inherit}
.boot{min-height:100vh;display:grid;place-items:center;color:#7e8797}
.srOnly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:1150px){.side{flex-basis:205px}.content{padding:35px 24px 80px}.header{padding:0 24px}.analyticsBody{grid-template-columns:1fr}.withCalculator{grid-template-columns:1fr}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.side{height:auto;position:relative;flex-basis:auto;padding:13px 13px 8px;width:100%;border-right:0;border-bottom:1px solid var(--line)}.shell{display:block}.brand{margin:0 0 10px 4px}.nav{display:flex;overflow-x:auto;gap:5px;padding-bottom:4px}.nav::before{display:none}.navItem{min-height:38px;flex:none;padding:9px 12px;gap:7px;white-space:nowrap;font-size:12px}.navIcon{font-size:15px;width:15px}.sideBottom{display:none}.header{height:62px;padding:0 16px}.crumb{font-size:11px}.courseSelect>span{display:none}.courseSelect select{min-width:120px;max-width:178px}.content{padding:27px 16px 65px}.content h1{font-size:30px;letter-spacing:-1.15px}.twoCols,.statGrid,.analyticsBody,.quickLinks,.lessonLayout,.trackGrid{grid-template-columns:1fr}.homeFeature{min-height:285px;padding:26px}.homeFeature h2{font-size:27px}.lessonList{display:flex;overflow-x:auto;max-height:175px;border-right:0;border-bottom:1px solid var(--line);padding:9px}.lessonList>div{min-width:160px}.lessonMain{padding:27px 23px 35px}.filters{grid-template-columns:1fr 1fr;padding:12px}.filters input{grid-column:span 2}.bankRow{padding:17px 12px;gap:11px;grid-template-columns:29px minmax(0,1fr) 24px}.bankOrdinal{width:27px;height:27px}.bankRow>strong{font-size:0}.bankRow>strong::after{content:"›";font-size:20px}.solveCard{padding:22px}.content .questionStem{font-size:20px}.statGrid{gap:10px}.statGrid .card{min-height:130px}.stat{margin:9px 0 2px}.skillRow{grid-template-columns:minmax(96px,1fr) minmax(75px,.8fr) 44px;gap:10px}}
@media(max-width:440px){.courseSelect select{min-width:110px;max-width:144px}.crumb{gap:4px}.filters{grid-template-columns:1fr}.filters input{grid-column:auto}.content h1{font-size:27px}.solveTools{flex-wrap:wrap}.probeChoices{grid-template-columns:1fr}.choice{gap:10px;padding:12px}.lessonMain{padding:22px 17px}}
@media(max-width:1060px) and (min-width:761px){.side{flex-basis:192px}.lessonLayout{grid-template-columns:210px minmax(0,1fr)}.homeFeature h2{font-size:30px}}

/* Solve runs in its own exam-style focus environment. */
.focusMode .side{display:none}
.focusMode .header{padding:0 clamp(24px,4vw,64px)}
.focusMode .content{width:min(100%,1280px);padding-top:37px}
.focusMode .solveLayout{max-width:970px}
.focusMode .solveCard{min-height:590px}
.focusMode .withCalculator{max-width:1320px}
.focusMode .solveHeader{max-width:970px;margin-left:auto;margin-right:auto}
@media(max-width:760px){.focusMode .content{padding:20px 14px 60px}.focusMode .solveCard{min-height:auto}}

/* Tenet — Neutral Ink. Original components; Linear-style dense single-viewport shell.
   All values are app-owned, never system-provided picker/panel skins. */
.shell{
 --tenet-bg:#131415;--tenet-surface:#1b1c1f;--tenet-surface-raised:#27292d;
 --tenet-panel:#1c1e20;--tenet-sidebar:#101113;--tenet-accent:#b2b8c2;
 --tenet-accent-strong:#9299a4;--tenet-accent-muted:#31353b;
 --tenet-stroke:#34363a;--tenet-text:#eeeeef;--tenet-muted:#a5a7ae;--tenet-faint:#83868c;
 --ink:var(--tenet-text);--muted:var(--tenet-muted);--subtle:var(--tenet-faint);
 --line:var(--tenet-stroke);--background:var(--tenet-bg);--panel:var(--tenet-surface);
 --accent:var(--tenet-accent-strong);--accent-soft:var(--tenet-accent-muted);

alse" data-value="Physics">Physics</button><button class="dropdownOption" role="option" aria-selected="false" data-value="Algebra 2">Algebra 2</button></div></div></div></header><main class="content" id="view"></main></div></div><script id="pages" type="application/json">{"Home": "<section class=\"homeWorkspace\"><div class=\"workspaceTitle\"><div><div class=\"eyebrow\">STUDY OVERVIEW / SAT MATH<\/div><h1>Study queue<\/h1><p class=\"sub\">Your next actions, prioritized from recorded learning evidence.<\/p><\/div><button class=\"secondary\" data-page=\"Question Bank\">Browse questions \u2197<\/button><\/div><div class=\"homeColumns\"><div class=\"studyQueue\"><div class=\"queueToolbar\"><span>Recommended next<\/span><span>10 study blocks<\/span><\/div><button class=\"studyRow studyRowActive\" data-row=\"0\"><span class=\"studyStatus\"><\/span><span class=\"studyCode\">TN-101<\/span><span class=\"studyRowName\">Conditional probability<\/span><span class=\"studyRowMode\">Review<\/span><span class=\"studyTime\">12 min<\/span><\/button><button class=\"studyRow \" data-row=\"1\"><span class=\"studyStatus\"><\/span><span class=\"studyCode\">TN-102<\/span><span class=\"studyRowName\">Two-way tables<\/span><span class=\"studyRowMode\">Recall<\/span><span class=\"studyTime\">6 min<\/span><\/button><button class=\"studyRow \" data-row=\"2\"><span class=\"studyStatus\"><\/span><span class=\"studyCode\">TN-103<\/span><span class=\"studyRowName\">Linear equations<\/span><span class=\"studyRowMode\">Transfer<\/span><span class=\"studyTime\">8 min<\/span><\/button><button class=\"studyRow \" data-row=\"3\"><span class=\"studyStatus\"><\/span><span class=\"studyCode\">TN-104<\/span><span class=\"studyRowName\">Words in context<\/span><span class=\"studyRowMode\">Practice<\/span><span class=\"studyTime\">9 min<\/span><\/button><button class=\"studyRow \" data-row=\"4\"><span class=\"studyStatus\"><\/span><span class=\"studyCode\">TN-105<\/span><span class=\"studyRowName\">Graph transformations<\/span><span class=\"studyRowMode\">Practice<\/span><span class=\"studyTime\">7 min<\/span><\/button><button class=\"studyRow \" data-row=\"5\"><span class=\"studyStatus\"><\/span><span class=\"studyCode\">TN-106<\/span><span class=\"studyRowName\">Evaluate statistical claims<\/span><span class=\"studyRowMode\">Practice<\/span><span class=\"studyTime\">10 min<\/span><\/button><button class=\"studyRow \" data-row=\"6\"><span class=\"studyStatus\"><\/span><span class=\"studyCode\">TN-107<\/span><span class=\"studyRowName\">Transitions<\/span><span class=\"studyRowMode\">Recall<\/span><span class=\"studyTime\">5 min<\/span><\/button><button class=\"studyRow \" data-row=\"7\"><span class=\"studyStatus\"><\/span><span class=\"studyCode\">TN-108<\/span><span class=\"studyRowName\">Quadratic vertex form<\/span><span class=\"studyRowMode\">Review<\/span><span class=\"studyTime\">6 min<\/span><\/button><button class=\"studyRow \" data-row=\"8\"><span class=\"studyStatus\"><\/span><span class=\"studyCode\">TN-109<\/span><span class=\"studyRowName\">Cross-text connections<\/span><span class=\"studyRowMode\">Practice<\/span><span class=\"studyTime\">12 min<\/span><\/button><button class=\"studyRow \" data-row=\"9\"><span class=\"studyStatus\"><\/span><span class=\"studyCode\">TN-110<\/span><span class=\"studyRowName\">Free-body diagrams<\/span><span class=\"studyRowMode\">Practice<\/span><span class=\"studyTime\">7 min<\/span><\/button><div class=\"queueToolbar\"><span>Other workspaces<\/span><span>Jump to<\/span><\/div><button class=\"studyRow\" data-page=\"Learn\"><span class=\"studyStatusMuted\"><\/span><span class=\"studyCode\">GO-001<\/span><span class=\"studyRowName\">Learning library<\/span><span class=\"studyRowMode\">Lessons<\/span><span class=\"studyTime\">\u2197<\/span><\/button><button class=\"studyRow\" data-page=\"Analytics\"><span class=\"studyStatusMuted\"><\/span><span class=\"studyCode\">GO-002<\/span><span class=\"studyRowName\">Performance analytics<\/span><span class=\"studyRowMode\">Insights<\/span><span class=\"studyTime\">\u2197<\/span><\/button><\/div><aside class=\"inspector\"><div class=\"inspectorHeader\">Study details <span>\u00b7\u00b7\u00b7<\/span><\/div><div class=\"inspectorBody\"><div class=\"eyebrow\">RECOMMENDED / SAT MATH<\/div><h2 id=\"insTitle\">Conditional probability<\/h2><p id=\"insDesc\">Review a missed conditional probability problem, then solve a fresh independent check.<\/p><button class=\"primary\" data-page=\"Solve\">Continue lesson \u2197<\/button><div class=\"inspectorRule\"><\/div><div class=\"inspectorProperty\"><span>Track<\/span><strong>SAT Math<\/strong><\/div><div class=\"inspectorProperty\"><span>Activity<\/span><strong id=\"insMode\">Review<\/strong><\/div><div class=\"inspectorProperty\"><span>Est. time<\/span><strong id=\"insTime\">12 min<\/strong><\/div><div class=\"inspectorRule\"><\/div><div class=\"eyebrow\">WHY THIS IS HERE<\/div><p class=\"inspectorHint\">This is representative design data, not your actual performance.<\/p><\/div><\/aside><\/div><\/section>", "Learn": "<div class=\"eyebrow\">MASTERCLASS / SAT MATH<\/div><h1>Learn the skills.<\/h1><p class=\"sub\">Course \u2192 unit \u2192 concept \u2192 worked example \u2192 fresh practice.<\/p><div class=\"lessonLayout\"><aside class=\"lessonList\"><div><h3>PROBLEM SOLVING<\/h3><button class=\"lessonItem lessonActive\">Conditional probability<\/button><button class=\"lessonItem\">Two-way tables<\/button><button class=\"lessonItem\">Percent change<\/button><button class=\"lessonItem\">Evaluating claims<\/button><h3>ALGEBRA<\/h3><button class=\"lessonItem\">Linear equations<\/button><button class=\"lessonItem\">Systems of equations<\/button><button class=\"lessonItem\">Functions<\/button><button class=\"lessonItem\">Quadratic form<\/button><h3>GEOMETRY<\/h3><button class=\"lessonItem\">Angles<\/button><button class=\"lessonItem\">Triangles<\/button><button class=\"lessonItem\">Circles<\/button><\/div><\/aside><article class=\"lessonMain\"><div class=\"eyebrow\">PROBLEM SOLVING / CONDITIONAL PROBABILITY<\/div><h2>Conditional probability<\/h2><p class=\"caption\">Prerequisites: fractions \u00b7 ratios \u00b7 sets<\/p><h3>THE PRINCIPLE<\/h3><p>Conditional probability measures the chance of an event, given that another event has already happened. The denominator is the number of outcomes that satisfy the given condition.<\/p><h3>WORKED EXAMPLE<\/h3><div class=\"worked\">In a group of 30 students, 18 play sports. Of those 18 students, 6 also play an instrument. What is the probability that a student plays an instrument, given they play sports?<br><br><strong>P(instrument | sports) = 6 / 18 = 1 / 3<\/strong><\/div><h3>TRY IT YOURSELF<\/h3><p>What changes if the condition is reversed? Identify the new denominator before calculating.<\/p><div class=\"buttons\"><button class=\"primary\" data-page=\"Solve\">Open independent check \u2197<\/button><button class=\"secondary\" data-page=\"Question Bank\">See related questions<\/button><\/div><\/article><\/div>", "Question Bank": "<div class=\"eyebrow\">QUESTION BANK / SAT MATH<\/div><h1>Question Bank<\/h1><p class=\"sub\">Filter by difficulty, skill, or completion status; open one question at a time.<\/p><div class=\"filters\"><input placeholder=\"Search questions or skills\" aria-label=\"Search questions\" id=\"bankSearch\"><input placeholder=\"Filter by skill\" aria-label=\"Filter by skill\"><div class=\"premiumSelect\"><button class=\"selectTrigger\" aria-expanded=\"false\" aria-haspopup=\"listbox\"><span>All difficulty layers<\/span><span>\u2304<\/span><\/button><div class=\"dropdownMenu\" role=\"listbox\" hidden><button class=\"dropdownOption\" role=\"option\" data-value=\"All difficulty layers\" aria-selected=\"true\">All difficulty layers<\/button><button class=\"dropdownOption\" role=\"option\" data-value=\"Foundation\">Foundation<\/button><button class=\"dropdownOption\" role=\"option\" data-value=\"Intermediate\">Intermediate<\/button><button class=\"dropdownOption\" role=\"option\" data-value=\"Advanced\">Advanced<\/button><\/div><\/div><div class=\"premiumSelect\"><button class=\"selectTrigger\" aria-expanded=\"false\" aria-haspopup=\"listbox\"><span>All questions<\/span><span>\u2304<\/span><\/button><div class=\"dropdownMenu\" role=\"listbox\" hidden><button class=\"dropdownOption\" role=\"option\" data-value=\"All questions\" aria-selected=\"true\">All questions<\/button><button class=\"dropdownOption\" role=\"option\" data-value=\"Unseen\">Unseen<\/button><button class=\"dropdownOption\" role=\"option\" data-value=\"Attempted\">Attempted<\/button><button class=\"dropdownOption\" role=\"option\" data-value=\"Bookmarked\">Bookmarked<\/button><\/div><\/div><\/div><div class=\"bankTop\"><strong id=\"bankCount\">10 sample questions<\/strong><span class=\"caption\">Illustrative content \u00b7 not exam calibrated<\/span><\/div><div class=\"bankList\"><button class=\"bankRow\" data-page=\"Solve\" data-q=\"1\"><span class=\"bankOrdinal\">01<\/span><span><span class=\"bankStem\">A box has 4 red and 6 blue marbles. What is the probability of blue given that a marble is not red?<\/span><span class=\"tags\"><span>SAT Math<\/span><span>Probability<\/span><span>Layer 2<\/span><\/span><\/span><strong>Open \u2197<\/strong><\/button><button class=\"bankRow\" data-page=\"Solve\" data-q=\"2\"><span class=\"bankOrdinal\">02<\/span><span><span class=\"bankStem\">The table shows how students travel to school. Calculate a conditional proportion.<\/span><span class=\"tags\"><span>SAT Math<\/span><span>Two-way tables<\/span><span>Layer 3<\/span><\/span><\/span><strong>Open \u2197<\/strong><\/button><button class=\"bankRow\" data-page=\"Solve\" data-q=\"3\"><span class=\"bankOrdinal\">03<\/span><span><span class=\"bankStem\">A function f(x) changes at a constant rate. Determine its y-intercept.<\/span><span class=\"tags\"><span>SAT Math<\/span><span>Linear equations<\/span><span>Layer 1<\/span><\/span><\/span><strong>Open \u2197<\/strong><\/button><button class=\"bankRow\" data-page=\"Solve\" data-q=\"4\"><span class=\"bankOrdinal\">04<\/span><span><span class=\"bankStem\">Which information is sufficient to establish a causal association?<\/span><span class=\"tags\"><span>SAT Math<\/span><span>Statistics<\/span><span>Layer 2<\/span><\/span><\/span><strong>Open \u2197<\/strong><\/button><button class=\"bankRow\" data-page=\"Solve\" data-q=\"5\"><span class=\"bankOrdinal\">05<\/span><span><span class=\"bankStem\">A quadratic function is written in vertex form. Identify its minimum.<\/span><span class=\"tags\"><span>SAT Math<\/span><span>Quadratics<\/span><span>Layer 3<\/span><\/span><\/span><strong>Open \u2197<\/strong><\/button><button class=\"bankRow\" data-page=\"Solve\" data-q=\"6\"><span class=\"bankOrdinal\">06<\/span><span><span class=\"bankStem\">Find the value of k that makes a system have no solution.<\/span><span class=\"tags\"><span>SAT Math<\/span><span>Systems<\/span><span>Layer 1<\/span><\/span><\/span><strong>Open \u2197<\/strong><\/button><button class=\"bankRow\" data-page=\"Solve\" data-q=\"7\"><span class=\"bankOrdinal\">07<\/span><span><span class=\"bankStem\">A circle has a radius of 7. Express its area in terms of \u03c0.<\/span><span class=\"tags\"><span>SAT Math<\/span><span>Geometry<\/span><span>Layer 2<\/span><\/span><\/span><strong>Open \u2197<\/strong><\/button><button class=\"bankRow\" data-page=\"Solve\" data-q=\"8\"><span class=\"bankOrdinal\">08<\/span><span><span class=\"bankStem\">Solve the inequality and interpret the range.<\/span><span class=\"tags\"><span>SAT Math<\/span><span>Inequalities<\/span><span>Layer 3<\/span><\/span><\/span><strong>Open \u2197<\/strong><\/button><button class=\"bankRow\" data-page=\"Solve\" data-q=\"9\"><span class=\"bankOrdinal\">09<\/span><span><span class=\"bankStem\">An investment rises by 5%, then declines by 5%. Find the net change.<\/span><span class=\"tags\"><span>SAT Math<\/span><span>Percent change<\/span><span>Layer 1<\/span><\/span><\/span><strong>Open \u2197<\/strong><\/button><button class=\"bankRow\" data-page=\"Solve\" data-q=\"10\"><span class=\"bankOrdinal\">10<\/span><span><span class=\"bankStem\">Determine which graph represents the transformed function.<\/span><span class=\"tags\"><span>SAT Math<\/span><span>Functions<\/span><span>Layer 2<\/span><\/span><\/span><strong>Open \u2197<\/strong><\/button><\/div><div class=\"pagination\"><button class=\"secondary\">\u2190 Previous<\/button><span>1\u201310 of 10<\/span><button class=\"secondary\">Next \u2192<\/button><\/div>", "Solve": "<div class=\"solveHeader\"><button class=\"secondary\" data-page=\"Question Bank\">\u2190 Question Bank<\/button><div class=\"solveTools\"><button aria-pressed=\"false\" id=\"bookmark\">\u2606 Bookmark<\/button><button id=\"calculatorToggle\" aria-pressed=\"false\">\u25a6 Calculator<\/button><\/div><\/div><div class=\"solveLayout\" id=\"solveLayout\"><article class=\"solveCard\"><div class=\"questionMeta\">PROBABILITY \u00b7 ORIGINAL PRACTICE <span>Layer 2<\/span><\/div><h1 class=\"questionStem\">A school club has 24 students. Of the 15 students who take mathematics, 6 also take physics. If a student is known to take mathematics, what is the probability that they also take physics?<\/h1><fieldset class=\"choices\"><legend class=\"srOnly\">Choose an answer<\/legend><label class=\"choice\"><input type=\"radio\" name=\"answer\" value=\"A\"><span class=\"letter\">A<\/span>1/4<\/label><label class=\"choice\"><input type=\"radio\" name=\"answer\" value=\"B\"><span class=\"letter\">B<\/span>2/5<\/label><label class=\"choice\"><input type=\"radio\" name=\"answer\" value=\"C\"><span class=\"letter\">C<\/span>3/5<\/label><label class=\"choice\"><input type=\"radio\" name=\"answer\" value=\"D\"><span class=\"letter\">D<\/span>5/8<\/label><\/fieldset><label class=\"reasonLabel\">Optional reasoning<textarea rows=\"2\" placeholder=\"Explain your denominator choice\u2026\"><\/textarea><\/label><div class=\"buttons\"><button class=\"secondary\" id=\"hintButton\">Need a hint?<\/button><button class=\"primary\" id=\"submitButton\">Check answer \u2197<\/button><\/div><div id=\"feedback\" class=\"hint\" hidden><\/div><\/article><aside class=\"calc\" id=\"calculatorPane\" hidden><header><strong>Calculator<\/strong><button id=\"closeCalculator\" aria-label=\"Close calculator\">\u00d7<\/button><\/header><div class=\"empty\">Calculator integration is a separate release gate.<\/div><\/aside><\/div>", "Practice Tests": "<div class=\"eyebrow\">PRACTICE TESTS<\/div><h1>Practice Tests<\/h1><p class=\"sub\">Focused independent practice, with no invented official scores.<\/p><article class=\"card\"><div class=\"eyebrow\">AVAILABLE MODE<\/div><h2>Independent practice<\/h2><p>Select unseen questions and record an honest first attempt. Full-length SAT and ACT simulations require validated exam blueprints and scoring.<\/p><div class=\"buttons\"><button class=\"primary\" data-page=\"Question Bank\">Choose unseen questions \u2197<\/button><button class=\"secondary\" data-page=\"Analytics\">Review past attempts<\/button><\/div><\/article><div class=\"footerNote\">Official full-length exam timing and predictive scaled scores are not available in this release.<\/div>", "Analytics": "<div class=\"eyebrow\">LEARNING ANALYTICS / SAT MATH<\/div><h1>Analytics<\/h1><p class=\"sub\">Independent accuracy, pacing, and skill evidence\u2014without simulated score predictions.<\/p><div class=\"statGrid\"><article class=\"card\"><span class=\"caption\">Independent first attempts<\/span><div class=\"stat\">\u2014<\/div><p>No connected learner records in this visual preview.<\/p><\/article><article class=\"card\"><span class=\"caption\">Median solving time<\/span><div class=\"stat\">\u2014<\/div><p>Visible after verified independent attempts.<\/p><\/article><article class=\"card\"><span class=\"caption\">Assisted & repeated<\/span><div class=\"stat\">\u2014<\/div><p>Reported separately from initial mastery.<\/p><\/article><\/div><div class=\"analyticsBody\"><article class=\"card\"><h2>Accuracy by skill<\/h2><div class=\"empty\">Skill performance will appear once real answers are recorded.<\/div><\/article><article class=\"card\"><div class=\"eyebrow\">RECOMMENDED NEXT<\/div><h2>Establish a baseline<\/h2><p>Take a set of fresh questions without hints to generate reliable independent-performance evidence.<\/p><div class=\"buttons\"><button class=\"primary\" data-page=\"Question Bank\">Start baseline \u2197<\/button><\/div><\/article><\/div><div class=\"trendPanel\"><h2>Independent accuracy over time<\/h2><p>Trend appears after at least two days with independent attempt records.<\/p><div class=\"empty\">No verified trend data available<\/div><\/div>"}</script><script>

function openSelect(root){document.querySelectorAll('.dropdownMenu').forEach(e=>{if(e.parentElement!==root){e.hidden=true;e.parentElement.querySelector('.selectTrigger').setAttribute('aria-expanded','false')}});const menu=root.querySelector('[role="listbox"]');const willOpen=menu.hidden;menu.hidden=!willOpen;root.querySelector('.selectTrigger').setAttribute('aria-expanded',String(willOpen));if(willOpen)menu.querySelector('[aria-selected="true"]')?.focus()}
function closeSelect(root){root.querySelector('.dropdownMenu').hidden=true;root.querySelector('.selectTrigger').setAttribute('aria-expanded','false');root.querySelector('.selectTrigger').focus()}
document.addEventListener('click',e=>{const trigger=e.target.closest('.selectTrigger');if(trigger){openSelect(trigger.closest('.premiumSelect'));return}const option=e.target.closest('.dropdownOption');if(option){const root=option.closest('.premiumSelect');root.querySelector('.selectTrigger span').textContent=option.dataset.value;root.querySelectorAll('.dropdownOption').forEach(o=>o.setAttribute('aria-selected',String(o===option)));closeSelect(root);return}const link=e.target.closest('[data-page]');if(link){e.preventDefault();render(link.dataset.page);return}const row=e.target.closest('[data-row]');if(row){document.querySelectorAll('.studyRow[data-row]').forEach(x=>x.classList.toggle('studyRowActive',x===row));document.getElementById('insTitle').textContent=row.querySelector('.studyRowName').textContent;document.getElementById('insMode').textContent=row.querySelector('.studyRowMode').textContent;document.getElementById('insTime').textContent=row.querySelector('.studyTime').textContent;return}if(e.target.closest('#bookmark')){let b=e.target.closest('#bookmark');let now=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(now));b.textContent=now?'★ Saved':'☆ Bookmark';return}if(e.target.closest('#calculatorToggle')){let p=document.getElementById('calculatorPane'),b=document.getElementById('calculatorToggle');p.hidden=!p.hidden;b.setAttribute('aria-pressed',String(!p.hidden));document.getElementById('solveLayout').classList.toggle('withCalculator',!p.hidden);return}if(e.target.closest('#closeCalculator')){document.getElementById('calculatorPane').hidden=true;document.getElementById('solveLayout').classList.remove('withCalculator');document.getElementById('calculatorToggle').setAttribute('aria-pressed','false');return}if(e.target.closest('#hintButton')){let box=document.getElementById('feedback');box.hidden=false;box.innerHTML='<strong>Hint</strong><p>Use the 15 mathematics students as the denominator—not all 24 students.</p>';return}if(e.target.closest('#submitButton')){let answer=document.querySelector('input[name="answer"]:checked'),box=document.getElementById('feedback');box.hidden=false;box.innerHTML=answer?`<strong>${answer.value==='B'?'Correct':'Check the condition'}</strong><p>6 out of 15 mathematics students also take physics, so the conditional probability is 6/15 = 2/5.</p>`:'<strong>Choose an answer first</strong>';return}if(e.target.closest('.choice')){let choice=e.target.closest('.choice');document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('choiceActive',x===choice))}document.querySelectorAll('.dropdownMenu:not([hidden])').forEach(menu=>{menu.hidden=true;menu.parentElement.querySelector('.selectTrigger').setAttribute('aria-expanded','false')});});
document.addEventListener('keydown',e=>{const root=e.target.closest('.premiumSelect');if(!root)return;const menu=root.querySelector('.dropdownMenu');if(e.key==='Escape'){e.preventDefault();closeSelect(root)}else if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();if(menu.hidden){openSelect(root);return}const items=[...menu.querySelectorAll('[role="option"]')];let idx=items.indexOf(document.activeElement);items[(idx+(e.key==='ArrowDown'?1:-1)+items.length)%items.length].focus()}else if(e.key==='Enter'&&!menu.hidden&&e.target.matches('[role="option"]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{if(e.target.id==='bankSearch'){let q=e.target.value.toLowerCase();let visible=0;document.querySelectorAll('.bankRow').forEach(x=>{let show=x.textContent.toLowerCase().includes(q);x.hidden=!show;if(show)visible++});document.getElementById('bankCount').textContent=`${visible} sample questions`}});
render(pages[decodeURIComponent(location.hash.slice(1))]?decodeURIComponent(location.hash.slice(1)):'Home');
</script></body></html>
