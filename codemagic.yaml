# Codemagic Apple Silicon workflow for Mastery Engine 2
workflows:
  mastery-engine-macos:
    name: Mastery Engine 2 — standalone Apple Silicon DMG
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        NEXT_TELEMETRY_DISABLED: "1"
        UV_NO_PROGRESS: "1"
    scripts:
      - name: Verify Mac tools and install uv
        script: |
          set -euo pipefail
          test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64
          for command in node npm git xcrun swiftc codesign hdiutil; do
            command -v "$command" >/dev/null || { echo "Missing: $command"; exit 1; }
          done
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
          if ! command -v uv >/dev/null; then brew install uv; fi
          uv --version
      - name: Validate Mastery source and run regression tests
        script: |
          set -euo pipefail
          test -f scripts/apply_overlay.py
          test -f scripts/build_portable_macos.sh
          test -f overlay/apps/api/mastery_ext/router.py
          test -f overlay/apps/web/src/app/mastery/page.tsx
          uv python install 3.11
          uv run --no-project --python 3.11 --with pytest python -m pytest tests/ -q
          bash -n scripts/*.sh
      - name: Build bundled native Mac app and DMG
        script: |
          set -euo pipefail
          bash scripts/build_portable_macos.sh
          test -s dist/MasteryEngine2-AppleSilicon-Standalone.dmg
      - name: Prove real app starts and grades an offline question
        script: |
          set -euo pipefail
          bash scripts/codemagic_smoke.sh
      - name: Publish verified DMG
        script: |
          set -euo pipefail
          mkdir -p release
          cp dist/MasteryEngine2-AppleSilicon-Standalone.dmg release/
          shasum -a 256 release/*.dmg > release/SHA256SUMS.txt
    artifacts:
      - release/*.dmg
      - release/SHA256SUMS.txt
