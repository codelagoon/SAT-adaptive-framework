# Codemagic's YAML workflow runs on Apple's M2 Mac mini (also produces M1-compatible arm64 binaries).
# This branch is deliberately manual-trigger-only; no Apple signing secrets are required.
workflows:
  mastery-engine-macos:
    name: Mastery Engine 2 — standalone Apple Silicon DMG
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        NEXT_TELEMETRY_DISABLED: "1"
        UV_NO_PROGRESS: "1"
    scripts:
      - name: Verify toolchain and install uv on the build machine
        script: |
          set -euo pipefail
          test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64
          for command in node npm git xcrun swiftc codesign hdiutil; do
            command -v "$command" >/dev/null || { echo "Missing macOS build tool: $command" >&2; exit 1; }
          done
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
          if ! command -v uv >/dev/null; then
            brew install uv
          fi
          uv --version
          node --version
          xcrun swiftc --version
      - name: Install browser verification tools
        script: |
          set -euo pipefail
          uv python install 3.11
          uv run --no-project --python 3.11 --with pytest --with playwright python -m playwright install chromium
          npm install --prefix "${PWD}/build/tenet-browser" --no-audit --no-fund playwright
      - name: Verify source integrity and run regression tests
        script: |
          set -euo pipefail
          test -f scripts/apply_overlay.py
          test -f scripts/build_portable_macos.sh
          test -f overlay/apps/api/mastery_ext/router.py
          test -f overlay/apps/web/src/app/mastery/page.tsx
          uv run --no-project --python 3.11 --with pytest --with playwright python -m pytest tests/ -q
          for script in scripts/*.sh; do bash -n "$script" || exit; done
      - name: Build complete self-contained Apple Silicon application
        script: |
          set -euo pipefail
          TENET_LINT=1 bash scripts/build_portable_macos.sh
          test -s dist/MasteryEngine2-AppleSilicon-Standalone.dmg
      - name: Prove bundled app can create, grade, and erase a temporary course
        script: |
          set -euo pipefail
          export TENET_UI_E2E=1
          export PLAYWRIGHT_MODULE="${PWD}/build/tenet-browser/node_modules/playwright"
          export CHROMIUM_EXECUTABLE="$(uv run --no-project --python 3.11 --with pytest --with playwright python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          bash scripts/codemagic_smoke.sh
          cat build/tenet-eslint.log
          test "$(cat build/tenet-eslint.status)" = 0
      - name: Publish DMG only after a successful live smoke test
        script: |
          set -euo pipefail
          mkdir -p release
          cp dist/MasteryEngine2-AppleSilicon-Standalone.dmg release/
          shasum -a 256 release/*.dmg > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt
    artifacts:
      - release/*.dmg
      - release/SHA256SUMS.txt
      - build/ui-evidence/**
      - build/preview-screenshots/**
      - build/tenet-eslint.*
