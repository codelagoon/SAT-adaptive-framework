name: Build standalone Mastery Engine 2 DMG
on:
  workflow_dispatch:
  push:
    branches:
      - mastery-engine-mac-build
permissions:
  contents: read
jobs:
  apple-silicon:
    name: Build and smoke-test Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - name: Unit and integration-contract tests (collect failures)
        run: |
          set +e
          uv run --with pytest --python 3.11 python -m pytest tests/ -q > "${RUNNER_TEMP}/mastery-unit.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/mastery-unit.log"
          bash -n scripts/*.sh
          syntax_status=$?
          if [ "$syntax_status" -ne 0 ]; then status="$syntax_status"; fi
          echo "$status" > "${RUNNER_TEMP}/mastery-unit-status"
          echo "Unit-test status: $status (real app build will still be attempted; release remains gated)"
          exit 0
      - name: Build portable app and DMG
        run: bash scripts/build_portable_macos.sh
      - name: Smoke test bundled runtime (no system Python or Node)
        run: bash scripts/codemagic_smoke.sh
      - name: Release gate (all unit tests must pass)
        run: |
          test "$(cat "${RUNNER_TEMP}/mastery-unit-status")" = 0 || {
            echo 'Unit tests failed: bundle may be useful for diagnosis, but no release is allowed.'
            exit 1
          }
      - name: Upload installable DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasteryEngine2-Standalone-M1-DMG
          path: dist/MasteryEngine2-AppleSilicon-Standalone.dmg
          retention-days: 14
          if-no-files-found: error
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MasteryEngine2-Build-Logs
          path: ${{ runner.temp }}/mastery-start.log
          if-no-files-found: ignore
