name: Build standalone Mastery Engine 2 DMG
on:
  workflow_dispatch:
  push:
    branches:
      - mastery-engine-mac-build
permissions:
  contents: read
jobs:
  apple-silicon:
    name: Build and smoke-test Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - name: Install browser verification tools
        run: |
          uv run --with pytest --with playwright --python 3.11 python -m playwright install chromium
          npm install --prefix "${RUNNER_TEMP}/tenet-browser" --no-audit --no-fund playwright
      - name: Unit and integration-contract tests
        run: |
          uv run --with pytest --with playwright --python 3.11 python -m pytest tests/ -q
          for script in scripts/*.sh; do bash -n "$script" || exit; done
      - name: Build portable app and DMG
        run: bash scripts/build_portable_macos.sh
      - name: Smoke test bundled runtime (no system Python or Node)
        run: |
          export TENET_UI_E2E=1
          export PLAYWRIGHT_MODULE="${RUNNER_TEMP}/tenet-browser/node_modules/playwright"
          export CHROMIUM_EXECUTABLE="$(uv run --with pytest --with playwright --python 3.11 python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          bash scripts/codemagic_smoke.sh
      - name: Upload installable DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasteryEngine2-Standalone-M1-DMG
          path: dist/MasteryEngine2-AppleSilicon-Standalone.dmg
          retention-days: 14
          if-no-files-found: error
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MasteryEngine2-Build-Logs
          path: ${{ runner.temp }}/mastery-codemagic-smoke.log
          if-no-files-found: ignore
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tenet-Browser-Evidence
          path: |
            build/ui-evidence/
            build/preview-screenshots/
          if-no-files-found: ignore
